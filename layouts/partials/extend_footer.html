{{- if eq .Layout "pagefind-search" }}
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var target = document.getElementById("search");
    var fallback = document.getElementById("search-fallback");
    if (!target) return;
    if (typeof PagefindUI === "undefined") {
      if (fallback) fallback.hidden = false;
      return;
    }
    var params = new URLSearchParams(window.location.search);
    var search = new PagefindUI({
      element: "#search",
      showImages: false,
      showSubResults: true,
      translations: {
        placeholder: "搜索文章…",
        clear_search: "清空",
        load_more: "加载更多",
        search_label: "搜索文章",
        searching: "搜索中…",
        zero_results: "未找到 [SEARCH_TERM] 的相关文章",
        one_result: "找到 [COUNT] 篇文章",
        many_results: "找到 [COUNT] 篇文章"
      },
      processTerm: function (term) {
        params.set("q", term);
        history.replaceState(null, "", "?" + params.toString());
        return term;
      }
    });
    var query = params.get("q");
    if (query) search.triggerSearch(query);

    function resetSearchParam() {
      var input = document.querySelector(".pagefind-ui__search-input");
      if (input && input.value.trim() === "") {
        params.delete("q");
        history.replaceState(null, "", window.location.pathname);
      }
    }
    document.addEventListener("input", function (event) {
      if (event.target && event.target.classList && event.target.classList.contains("pagefind-ui__search-input")) resetSearchParam();
    });
    document.addEventListener("click", function (event) {
      if (event.target && event.target.classList && event.target.classList.contains("pagefind-ui__search-clear")) setTimeout(resetSearchParam, 0);
    });
  });
</script>
{{- end }}
